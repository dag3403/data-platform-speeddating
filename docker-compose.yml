name: ${PROJECT_NAME:-dpl}

networks:
  dpl_net:

volumes:
  minio_data:
  postgres_data:
  metabase_data:


services:
  minio:
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [dpl_net]
    profiles: ["base", "seed"]

  mc:
    image: ${MC_IMAGE}
    depends_on:
      - minio
    entrypoint: /bin/sh
    command: -lc "
      sleep 5 &&
      mc alias set dpl http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p dpl/dpl || true &&
      mc cp --recursive /seed/raw/ dpl/dpl/raw/ || true"
    volumes:
      - ./data:/seed:ro
    networks: [dpl_net]
    profiles: ["seed"]

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d
    networks: [dpl_net]
    profiles: ["base", "viz"]

  spark-master:
    image: ${SPARK_IMAGE}
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_PACKAGES=org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.3
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "7077:7077"
      - "8080:8080"
    volumes:
      - ./spark/jobs:/opt/bitnami/spark/jobs:ro
    networks: [dpl_net]
    depends_on:
      - minio
    profiles: ["base"]

  spark-worker-1:
    image: ${SPARK_IMAGE}
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_PACKAGES=org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.3
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
    mem_limit: 4g #añadido por mi
    networks: [dpl_net]
    depends_on:
      - spark-master
    profiles: ["base"]

  spark-worker-2:
    image: ${SPARK_IMAGE}
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=4G
      - SPARK_PACKAGES=org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262,org.postgresql:postgresql:42.7.3
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
    mem_limit: 4g #añadido por mi
    networks: [dpl_net]
    depends_on:
      - spark-master
    profiles: ["base"]

  jupyter:
    image: ${JUPYTER_IMAGE}
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    environment:
      - SPARK_HOME=/usr/local/spark-3.5.0-bin-hadoop3
      - PYSPARK_SUBMIT_ARGS=--packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262 --master spark://spark-master:7077 pyspark-shell
      - JUPYTER_TOKEN=${JUPYTER_TOKEN}
      - AWS_ACCESS_KEY_ID=${MINIO_ROOT_USER}
      - AWS_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD}
      - AWS_DEFAULT_REGION=us-east-1
    ports:
      - "8888:8888"
    volumes:
      - ./notebooks:/home/jovyan/work
      - ./spark/jobs:/home/jovyan/jobs:ro
    networks: [dpl_net]
    depends_on:
      - spark-master
      - minio
    profiles: ["base"]

  metabase:
    image: ${METABASE_IMAGE}
    ports:
      - "3000:3000"
    environment:
      MB_DB_FILE: /metabase.db
    volumes:
      - metabase_data:/metabase.db
    networks: [dpl_net]
    depends_on:
      - postgres
    profiles: ["viz"]
